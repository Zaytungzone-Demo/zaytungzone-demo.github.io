<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giriş · Restoranınız</title>
    <link rel="icon" type="image/svg+xml" href="/images/brand/logo.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <script>
      // Zaten oturum açıksa doğrudan admin'e yönlendir
      if (sessionStorage.getItem("zz_session") === "active") {
        window.location.replace("/admin.html");
      }
    </script>
  </head>
  <body>
    <main class="login-page">
      <div class="login-card">
        <div>
          <a class="admin-brand" href="/">
            <img src="/images/brand/logo.svg" alt="" width="42" height="42" />
            <span><b>RESTORANINIZ</b><em>CONTROL ROOM</em></span>
          </a>
          <h1>Fiyatlar değişir.<br />Panik yapmayın.</h1>
          <p>Menüyü güncellemek için yönetici hesabıyla giriş yapın.</p>
        </div>
        <form class="login-form" id="login-form">
          <label>Kullanıcı adı<input name="username" autocomplete="username" value="admin" required /></label>
          <label>Şifre<input name="password" type="password" autocomplete="current-password" placeholder="admin123" required /></label>
          <p class="form-error" id="login-error" hidden></p>
          <button id="login-submit">Giriş yap</button>
          <small style="color: #7b8893; font-size: 11px; text-align: center; display: block; margin-top: 4px;">Varsayılan: admin / admin123</small>
        </form>
      </div>
    </main>

    <script>
      const form = document.getElementById("login-form");
      const error = document.getElementById("login-error");
      const submit = document.getElementById("login-submit");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        error.hidden = true;

        const data = Object.fromEntries(new FormData(form));
        let loggedIn = false;

        // 1. Önce arka uç API varsa dene
        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(data),
          });
          if (response.ok) {
            loggedIn = true;
          }
        } catch (err) {}

        // 2. Statik fallback (GitHub Pages için varsayılan kontrol)
        if (!loggedIn) {
          if (data.username === "admin" && data.password === "admin123") {
            loggedIn = true;
          }
        }

        if (loggedIn) {
          sessionStorage.setItem("zz_session", "active");
          document.cookie = "zz_session=active; path=/; max-age=86400; SameSite=Lax";
          window.location.replace("/admin.html");
          return;
        }

        error.textContent = "Kullanıcı adı veya şifre hatalı. (Varsayılan: admin / admin123)";
        error.hidden = false;
        submit.disabled = false;
      });
    </script>
  </body>
</html>
